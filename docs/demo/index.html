<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>審片台</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* 版面：剪輯室的暗色工作台。左邊是播放器、全片總覽、前後畫面、魚骨時間軸；右邊是這一刻的說明和意見欄。手機上疊成一欄，播放器固定在頂端。 */
:root{
  color-scheme:dark;
  --bg:#0b0f14; --panel:#131a22; --panel2:#1a232e; --line:#2a3644; --fg:#e8edf2; --dim:#93a1b0; --accent:#ffd166;
  --aiv:#ff5fa2; --aii:#ff9ac4; --realv:#2fe0a0; --real:#4ccf8e; --fig:#5fb4e8; --photo:#38c7c0; --b3d:#f0b545; --bvid:#ff8a3d; --code:#b18cff; --card:#7d8896; --warn:#ff7b6b;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--sans);font-size:14px;line-height:1.55;padding-block:12px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
*{box-sizing:border-box}
button{white-space:nowrap;font:inherit;color:inherit;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer}
button:hover{border-color:var(--dim)} button:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;margin-bottom:10px}
h1{font-size:18px;font-weight:700;margin:0} header .hint{color:var(--dim);font-size:12.5px}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:16px;align-items:start}
.left{display:flex;flex-direction:column;gap:12px;min-width:0}
.right{display:flex;flex-direction:column;gap:12px;min-width:0;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}
.box{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px}
.lab{font-size:11.5px;letter-spacing:.08em;color:var(--dim);margin-bottom:6px}
/* 播放器 */
.player{background:#000;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.screen{position:relative;aspect-ratio:16/9;max-height:52vh;margin:0 auto;background:#000;cursor:pointer;max-width:100%}
.screen video,.screen .pv{position:absolute;inset:0;width:100%;height:100%}
.pv{background-size:1500% 1000%;background-repeat:no-repeat;image-rendering:auto}
.pvtag{position:absolute;left:8px;top:8px;background:rgba(0,0,0,.7);border:1px solid var(--accent);color:var(--accent);font-size:11.5px;padding:1px 7px;border-radius:4px}
.ctl{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:8px;background:var(--panel)}
.ctl .time{margin-left:auto;font-size:13px}
#play{min-width:74px;background:var(--accent);color:#1a1300;border-color:var(--accent);font-weight:700}
/* 全片總覽：放在播放器裡、按鈕下面，不用捲動就能拖*/
.ovbar{position:absolute;left:0;right:0;bottom:0;z-index:3;padding:22px 14px 10px;background:linear-gradient(transparent,rgba(0,0,0,.75));opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s;cursor:default}
.screen:hover .ovbar,.ovbar.on,.screen:focus-within .ovbar{opacity:1;transform:none}
.ovbar .ov{margin-top:0}
.hov{position:absolute;bottom:52px;width:200px;margin-left:-100px;display:none;pointer-events:none;background:#000;border:2px solid #fff;border-radius:6px;overflow:hidden}
.hov.on{display:block}.hth{aspect-ratio:16/9;background-size:1500% 1000%;background-repeat:no-repeat}.htm{text-align:center;font-size:12px;padding:2px 0;background:rgba(0,0,0,.8)}

.ov{position:relative;height:30px;background:var(--panel2);border-radius:4px;cursor:pointer;touch-action:none;margin-top:16px}
.ov i{position:absolute;top:6px;bottom:0;display:block;border-right:1px solid var(--bg)}
.ov .chm{position:absolute;top:0;bottom:0;width:1px;background:var(--fg);opacity:.55}
.ov .pin{position:absolute;top:-13px;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:var(--accent);border:2px solid var(--bg)}
.ov .ph{position:absolute;top:-4px;bottom:-4px;width:2px;margin-left:-1px;background:#fff}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:8px;font-size:12px;color:var(--dim)}
.legend b{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}
.legend span span{color:var(--fg)}
/* 前後畫面 */
.near{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.near .c{background:var(--panel2);border:1px solid var(--line);border-radius:6px;overflow:hidden;cursor:pointer;min-width:0;border-top:3px solid var(--k)}
.near .c.cur{outline:2px solid #fff}
.near .c.none{visibility:hidden}
.near .th{aspect-ratio:16/9;background-size:1500% 1000%;background-repeat:no-repeat}
.near .tx{padding:3px 6px 5px;font-size:11.5px;line-height:1.35}
.near .tx div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .near .tx .m{color:var(--dim);font-size:10.5px}
/* 魚骨 */
.fishwrap{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.fishwrap .now{position:absolute;left:50%;top:0;bottom:0;width:2px;margin-left:-1px;background:#fff;z-index:5;pointer-events:none}
.fishwrap .now::after{content:"";position:absolute;left:-5px;top:0;border:6px solid transparent;border-top-color:#fff}
.lanes{position:absolute;left:8px;z-index:6;font-size:10.5px;letter-spacing:.1em;color:var(--dim);pointer-events:none}
.lanes span{position:absolute;left:0;background:var(--panel);padding:0 5px;border-radius:3px;white-space:nowrap}
.fish{overflow-x:auto;overflow-y:hidden;cursor:grab;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.fish.drag{cursor:grabbing}
.pad{padding:0 50%;width:max-content}
.strip{position:relative;height:412px}
.strip svg{position:absolute;left:-90px;top:0;overflow:visible;pointer-events:none}
.seg{position:absolute;width:112px;border-radius:4px;overflow:hidden;background:var(--panel2);border:1px solid var(--line);border-top:3px solid var(--k);cursor:pointer;user-select:none}
.seg .th{height:60px;background-size:1500% 1000%;background-repeat:no-repeat}
.seg .tx{font-size:10.5px;padding:1px 4px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg .rep{position:absolute;right:2px;top:2px;background:rgba(0,0,0,.78);font-size:10px;padding:0 4px;border-radius:3px;font-family:var(--mono)}
.seg .rep.hot{color:var(--warn)}
.seg.on{outline:2px solid #fff;z-index:3}
.tick{position:absolute;top:172px;font-size:10px;color:var(--dim);transform:translateX(-50%);font-family:var(--mono)}
.chapb{position:absolute;top:181px;height:20px;line-height:18px;background:var(--fg);color:var(--bg);font-size:11px;font-weight:700;padding:0 8px;border-radius:10px;white-space:nowrap;z-index:2;border:1px solid var(--bg)}
.mus{position:absolute;top:246px;height:16px;line-height:16px;font-size:10.5px;color:var(--dim);background:var(--panel2);border-left:2px solid var(--dim);overflow:hidden;white-space:nowrap}
.mus.q{background:repeating-linear-gradient(135deg,transparent 0 6px,var(--panel2) 6px 12px);color:var(--warn);border-color:var(--warn)}
.mus span{display:inline-block;width:640px;padding-left:6px}
.sfx{position:absolute;top:266px;font-size:10px;color:var(--accent);white-space:nowrap;padding-left:9px}
.sfx::before{content:"";position:absolute;left:-4px;top:4px;width:7px;height:7px;background:var(--accent);transform:rotate(45deg)}
.sub{position:absolute;height:22px;line-height:20px;font-size:12px;padding:0 7px;background:var(--panel2);border:1px solid var(--line);border-radius:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;user-select:none}
.sub.on{border-color:#fff;background:#2a3a4c;z-index:3}
.cpin{position:absolute;top:158px;width:20px;height:20px;margin-left:-10px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--accent);z-index:4;cursor:pointer}
.cpin span{display:block;transform:rotate(45deg);color:#1a1300;font-size:10.5px;font-weight:700;text-align:center;line-height:20px}
.composer{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:flex-start;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--panel2)}
.composer textarea{flex:1 1 260px;min-height:58px}
.composer .cside{flex:0 1 auto;min-width:0} .composer .cats{margin:0 0 6px}
.composer .note{flex:1 1 100%;margin-top:0}
.fishbody{position:relative}
#mark{border-color:var(--accent);color:var(--accent)}#spd{min-width:3.4em}#spd.on{background:var(--accent);color:#111;border-color:var(--accent)}
.cm textarea{min-height:48px;margin-top:5px;border-color:var(--accent)}
.cm .wait{color:var(--accent)}
.cm .dst{font-size:12px;color:var(--real);margin-top:4px}
.cm .wtag{color:#1a1300;background:var(--accent);border-radius:4px;padding:0 6px;font-weight:700}
.cm button.whole{font-size:12px;padding:2px 8px}
.cm button.whole[aria-pressed=true]{background:var(--accent);color:#1a1300;border-color:var(--accent)}
#sendall{margin-top:8px;background:var(--accent);color:#1a1300;border-color:var(--accent);font-weight:700}
/* 前審提案 */
.seg.prop{box-shadow:0 0 0 2px var(--accent)}
.seg .pb{position:absolute;left:2px;top:2px;background:var(--accent);color:#1a1300;font-size:10px;font-weight:700;padding:0 5px;border-radius:3px}
.ov .pm{position:absolute;top:0;height:5px;background:var(--accent)}
#pnotes{margin:0 0 10px;padding-left:1.2em;color:var(--dim);font-size:12.5px}
#propsum{position:sticky;top:0;z-index:4;background:var(--panel2);border:1px solid var(--accent);border-radius:6px;padding:8px 10px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
#propsum .big{font-weight:700} #propsum .warn{color:var(--warn);flex:1 1 100%;font-size:12.5px}
.pc{border-top:1px solid var(--line);padding:12px 0 12px 10px;margin-top:10px;display:grid;grid-template-columns:150px minmax(0,1fr);gap:8px 12px;border-left:3px solid var(--line)}
.pc.ok{border-left-color:var(--real)}
.pc .hd{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:13px}
.pc .pid{background:var(--accent);color:#1a1300;font-weight:700;border-radius:4px;padding:0 7px}
.pc .tm{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:0 6px;color:var(--accent);cursor:pointer;font-family:var(--mono)}
.pc .th{aspect-ratio:16/9;background-size:1500% 1000%;background-repeat:no-repeat;border-radius:4px;cursor:pointer}
.pc .cap{font-size:11px;color:var(--dim);margin-top:3px}
.pc h3{margin:0 0 5px;font-size:15px;text-wrap:balance}
.pc dl{display:grid;grid-template-columns:4.6em minmax(0,1fr);gap:3px 8px;margin:0}
.pc dt{color:var(--dim);font-size:12.5px} .pc dd{margin:0;min-width:0;overflow-wrap:anywhere}
.pc .said{grid-column:1/-1;font-size:13px;background:var(--panel2);padding:5px 8px;border-left:3px solid var(--accent);white-space:pre-wrap;overflow-wrap:anywhere}
.pc .act{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;align-items:flex-start}
.pc .act textarea{flex:1 1 220px;min-height:44px}
.okb{background:var(--real);color:#04130b;border-color:var(--real);font-weight:700}
.vok{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.vok .vst{color:var(--real);font-weight:700}.vok .vhint{color:var(--dim);font-size:13px}.okb.arm{background:var(--accent);border-color:var(--accent);color:#111}
.info .pp{color:var(--accent);font-weight:700}
.sendc{background:var(--fig);color:#04121c;border-color:var(--fig);font-weight:700}
.sendc[disabled]{opacity:.5;cursor:default}
.op{border:1px solid var(--line);border-radius:6px;padding:10px;margin:8px 0;background:var(--panel2)}
.op.on{border-color:var(--real)} .op h3{margin:0 0 4px;font-size:15px} .op p{margin:4px 0;white-space:pre-wrap} .op .m{color:var(--dim);font-size:12.5px}
#mine{flex:1 1 100%;border-top:1px solid var(--line);padding-top:8px}
#mine summary{cursor:pointer;font-weight:700;color:var(--accent);padding:4px 0}
#mine #list{max-height:46vh;overflow:auto}
#nav{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;border-bottom:1px solid var(--line);padding-bottom:10px}
#nav a{color:var(--fg);text-decoration:none;padding:5px 12px;border:1px solid var(--line);border-radius:6px;background:var(--panel2)}
#nav a.on{background:var(--accent);color:#1a1300;border-color:var(--accent);font-weight:700}
/* 說明 */
.info .kind{display:inline-block;font-size:12px;font-weight:700;color:#0b0f14;background:var(--k);border-radius:4px;padding:0 7px;margin-right:6px}
.info h2{font-size:16px;margin:4px 0 8px;font-weight:700;text-wrap:balance}
.info dl{display:grid;grid-template-columns:5.2em minmax(0,1fr);gap:4px 8px;margin:0}
.info dt{color:var(--dim);font-size:12.5px} .info dd{margin:0;min-width:0;overflow-wrap:anywhere}
.info .hot{color:var(--warn);font-weight:700}
.info .zh{font-size:15px}
/* 意見 */
textarea{width:100%;min-height:76px;resize:vertical;font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px}
.cats{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}
.cats button{padding:3px 10px;border-radius:14px;font-size:12.5px}
.cats button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.addrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
#add{background:var(--accent);color:#1a1300;border-color:var(--accent);font-weight:700}
.note{font-size:12px;color:var(--dim);margin-top:8px}
.note.bad{color:var(--warn)}
.cm{border-top:1px solid var(--line);padding:8px 0}
.cm .hd{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--dim)}
.cm .tm{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:0 6px;color:var(--accent);cursor:pointer;font-family:var(--mono)}
.cm .del{margin-left:auto;padding:0 7px;font-size:12px}
.cm .bd{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:3px}
.cm .rp{margin-top:5px;padding:5px 8px;background:var(--panel2);border-left:3px solid var(--real);font-size:13px;white-space:pre-wrap}
.cm .ok{color:var(--real)}
@media (max-width:900px){
  .wrap{grid-template-columns:minmax(0,1fr)}
  .right{position:static;max-height:none;overflow:visible}
  .player{position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
  .screen{max-height:34vh}
  .near{grid-template-columns:repeat(3,minmax(0,1fr))} .near .c.far{display:none}
  .pc{grid-template-columns:104px minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<nav id="nav" hidden></nav>
<header>
  <h1 id="ttl"></h1>
  <span class="hint">拖下面的魚骨時間軸看前後畫面，停下來就會顯示這個畫面怎麼做的，意見直接寫在影片下方的意見欄。</span>
</header>

<div class="wrap">
  <div class="left">
    <div class="player">
      <div class="screen" id="screen">
        <video id="vid" playsinline preload="none"></video>
        <div class="pv" id="pv"><span class="pvtag" id="pvtag">預覽縮圖</span></div>
        <div class="ovbar" id="ovbar"><div class="hov" id="hov"><div class="hth" id="hth"></div><div class="htm mono" id="htm">0:00</div></div><div class="ov" id="ov"></div></div>
      </div>
      <div class="ctl">
        <button id="play">▶ 播放</button>
        <button id="prev" title="上一個畫面">⏮ 上一畫面</button>
        <button id="next" title="下一個畫面">下一畫面 ⏭</button>
        <button id="b5">−5 秒</button>
        <button id="f5">+5 秒</button>
        <button id="spd" title="播放速度：點一下換 1× → 1.5× → 2×">1×</button>
        <button id="mark" title="先記下這個時間點，之後再寫意見">＋ 標記這裡</button>
        <span class="time mono"><span id="tnow">0:00.0</span> / <span id="ttot"></span></span>
      </div>
    </div>

      <div class="composer">
        <textarea id="ta" rows="2" placeholder="停在想改的地方，在這裡寫意見。例如：這張照片出現太多次、這段太久沒換畫面、字幕太快…"></textarea>
        <div class="cside">
          <div class="cats" id="cats"></div>
          <div class="addrow">
            <button id="add">在 <span id="addt" class="mono">0:00</span> 加上意見</button>
            <button id="addall">加為整支片的意見</button>
            <button class="sendc">傳給 <span class="ag">AI</span></button>
          </div>
        </div>
        <div class="note" id="note">意見會先存起來，不會馬上傳出去。全部寫完再按「傳給 <span class="ag">AI</span>」。</div>
        <details id="mine">
          <summary>我寫的意見（<span id="minen">0</span> 則）｜點開一次看完</summary>
          <div id="list"></div>
          <div class="addrow" style="margin-top:8px"><button class="sendc">全部寫完了，傳給 <span class="ag">AI</span></button><button id="copy" hidden>複製全部意見</button></div>
        </details>
        <div class="vok" id="vok" hidden></div>
      </div>
    <div class="box">
      <div class="lab">畫面類型顏色（時間軸在影片下方，點或拖可以跳）</div>
      <div class="legend" id="legend"></div>
    </div>

    <div class="box">
      <div class="lab">前後畫面</div>
      <div class="near" id="near"></div>
    </div>

    <div class="fishwrap">
      <div class="fishbody">
      <div class="now"></div>
      <div class="lanes"><span style="top:6px">畫面</span><span style="top:206px">聲音</span><span style="top:290px">字幕</span></div>
      <div class="fish" id="fish" tabindex="0" aria-label="魚骨時間軸，左右拖曳"><div class="pad"><div class="strip" id="strip"></div></div></div>
      </div>
    </div>

    <div class="box" id="propbox" hidden>
      <div class="lab">花錢前的提案（還沒送出，還沒扣任何點數）</div>
      <ul id="pnotes"></ul>
      <div id="openbox" hidden><div class="lab">開場三個提案（選一個；目前的草稿用的是提案 1）</div><div id="opens"></div></div>
      <div id="propsum"></div>
      <div id="props"></div>
    </div>
  </div>

  <div class="right">
    <div class="box info" id="info"></div>

  </div>

    row('畫面', p.desc); row('鏡頭', p.move); row(VO, p.zh); row('依據', p.basis); row('要注意', p.risk); row('這版改了', p.note); r.appendChild(dl); c.appendChild(r);
    cms.filter(x => x.prop === p.id && x.text).forEach(x => c.appendChild(el('div', 'said', '你的意見：' + x.text + (x.reply ? '\n' + AG + '：' + x.reply : ''))));
    if (appr[p.id] && !ok) c.appendChild(el('div', 'said', '這一項的內容已經修改過，之前的核准不算。請看過新版再決定。'));
    const act = el('div', 'act'), ta2 = el('textarea'); ta2.rows = 2; ta2.placeholder = p.id + ' 想改什麼？'; ta2.dataset.pid = p.id; ta2.value = pdr[p.id] || ''; ta2.oninput = () => { pdr[p.id] = ta2.value; };
    const sb = el('button', '', '送出意見'); sb.onclick = () => propSay(p);
    const ab = el('button', ok ? '' : 'okb', ok ? '✓ 已核准（按一下取消）' : '核准這一項'); ab.onclick = () => setAppr(p, !ok);
    act.appendChild(ta2); act.appendChild(sb); act.appendChild(ab); c.appendChild(act); box.appendChild(c); });
  if (keep) { const t2 = box.querySelector('textarea[data-pid="' + keep + '"]'); if (t2) { t2.focus(); t2.setSelectionRange(t2.value.length, t2.value.length); } } }

/* ---------- 傳給 AI：Artifact 模式用留言功能叫醒對話；雲端模式送出表單 ---------- */
let cmApi = null; (async () => { try { cmApi = window.claude && window.claude.use ? await window.claude.use('comments') : null; } catch (e) { cmApi = null; } })();
const BACK = '請回對話跟 ' + AG + ' 說「看意見」。';
function sendText(lim) { lim = lim || 3600; const arr = cms.slice().sort((a, b) => a.t - b.t), okP = P.filter(isOk), enc = new TextEncoder();
  let head = '【' + D.ver + '】審片台傳來：意見 ' + arr.length + ' 則' + (arr.some(c => !c.text) ? '（其中 ' + arr.filter(c => !c.text).length + ' 個標記還沒寫）' : '');
  if (D.openings) head += '；開場選提案 ' + (pick || '（還沒選）');
  if (P.length) head += '；已核准 ' + okP.length + '／' + P.length + ' 項' + (okP.length ? '（' + okP.map(p => p.id).join('、') + '，共 ' + okP.reduce((a, p) => a + p.cost, 0) + ' 點）' : '');
  if (!P.length) head += '；整版' + (vOk() ? '已核准' : '還沒核准');
  head += '。完整內容在審片台資料庫。'; let out = head;
  const shot = t => { let i = -1; (D.pic || []).forEach((p, k) => { if (p.s <= t + 0.001) i = k; }); if (i < 0) return ''; const p = D.pic[i]; return '｜鏡頭 ' + (i + 1) + (p.t === '鏡頭 ' + (i + 1) ? '' : '〈' + p.t + '〉') + (p.src ? '｜' + p.src : ''); };   // 每則意見帶鏡頭名和素材來源，AI 才知道要改哪一鏡
  for (const c of arr) { const line = '\n[' + (c.t >= 0 ? fmt(c.t) + shot(c.t) : '整片') + (c.prop ? ' ' + c.prop : '') + (c.whole ? '｜整片都要檢查' : '') + '] ' + (c.text || '（未寫）'); if (enc.encode(out + line).length > lim) { out += '\n…（其餘請讀資料庫）'; break; } out += line; }
  return out; }
async function sendAgent(ev) { const btn = ev && ev.currentTarget;
  { const f = await flushDrafts(); if (f.n || f.bad) render(); if (f.bad) { note('有 ' + f.bad + ' 則標記的文字存不進去，還沒傳。文字還在，請再按一次。', true); return; } }   // 標記裡寫好的字先存，再傳
  if (D.pub && db) return sendForm(btn);
  if (local || !db) { note('這個畫面連不上雲端，沒辦法直接傳。請按「複製全部意見」貼回對話。', true); return; }
  if (!cms.length && !P.some(isOk) && !vOk()) { note('還沒有意見或核准可以傳。', true); return; }
  if (!cmApi) { note('這個畫面不能直接傳給 ' + AG + '。' + BACK, true); return; }
  if (btn) btn.disabled = true; note('傳送中…');
  try { let can = 'available'; try { can = await cmApi.canSendToClaude(); } catch (e) { can = 'off'; }
    if (can !== 'available') { note((can === 'no_session' ? '現在沒有開著的 ' + AG + ' 對話可以接收。' : '這個畫面不能直接傳給 ' + AG + '。') + BACK, true); return; }
    const anchor = await cmApi.anchorFor($('ttl')); await cmApi.sendToClaude({ anchor, text: sendText() });
    note('已傳給 ' + AG + '（' + new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' }) + '）。' + AG + ' 會開始處理，不用回對話。'); }
  catch (e) { const c = e && e.code; note(c === 'consent_required' ? '還沒按「允許」，所以沒有傳出去。再按一次並選允許。' : c === 'claude_unavailable' ? '現在沒有開著的 ' + AG + ' 對話可以接收。' + BACK : c === 'rate_limited' ? '傳太快了，等一下再按。' : '沒有傳成功（' + (c || '未知') + '）。' + BACK, true); }
  finally { if (btn) btn.disabled = false; } }
document.querySelectorAll('.sendc').forEach(b => { b.onclick = sendAgent; });

/* ---------- 開場 ---------- */
show(0, 'init'); thumb(pv, 0); $('pvtag').textContent = '按播放開始';
